{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow mx-auto" style="max-width: 650px;">
        <div class="card-body">

            <h2 class="text-center mb-4">Editar Servicio</h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Nombre del servicio</label>
                    <input
                        type="text"
                        name="nombre_servicio"
                        class="form-control"
                        value="{{ servicio['nombre_servicio'] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <input
                        type="text"
                        name="descripcion"
                        class="form-control"
                        value="{{ servicio['descripcion'] }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input
                        type="text"
                        name="precio"
                        class="form-control"
                        value="{{ servicio['precio'] }}"
                        required>
                </div>

                <div class="d-grid gap-2">

                    <button type="submit" class="btn btn-primary">
                        Guardar cambios
                    </button>

                    <a href="{{ url_for('servicios') }}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
