{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow mx-auto" style="max-width: 650px;">
        <div class="card-body">

            <h2 class="text-center mb-4">Editar Factura</h2>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Cliente</label>

                    <select name="cliente_id"
                            class="form-control"
                            required>

                        {% for cliente in clientes %}
                        <option value="{{ cliente['id'] }}"
                            {% if cliente['id'] == factura['cliente_id'] %}
                                selected
                            {% endif %}>
                            {{ cliente['nombres'] }} {{ cliente['apellidos'] }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Servicio</label>

                    <select name="servicio_id"
                            class="form-control"
                            required>

                        {% for servicio in servicios %}
                        <option value="{{ servicio['id'] }}"
                            {% if servicio['id'] == factura['servicio_id'] %}
                                selected
                            {% endif %}>
                            {{ servicio['nombre_servicio'] }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha</label>

                    <input type="date"
                           name="fecha"
                           class="form-control"
                           value="{{ factura['fecha'] }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Total</label>

                    <input type="number"
                           step="0.01"
                           name="total"
                           class="form-control"
                           value="{{ factura['total'] }}"
                           required>
                </div>

                <div class="d-grid gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Guardar cambios
                    </button>

                    <a href="{{ url_for('facturacion') }}"
                       class="btn btn-outline-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
